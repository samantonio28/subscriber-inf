# GitHub Actions CI/CD для лабораторной работы №2.
#
# Пайплайн собирает ТРИ docker-образа (сервис, PostgreSQL, тестовый контейнер) и
# прогоняет тесты в порядке unit → integration → e2e, где E2E гоняется против
# реально развёрнутого сервиса + PostgreSQL.
#
# Порядок обеспечивается `needs`: если этап упал, следующие не запускаются
# (помечаются skipped). Отчёт генерируется всегда (if: always()).

name: CI

on:
  push:
  pull_request:

env:
  # Переиспользуем модульный кэш Go из образа (в нём /go/pkg/mod).
  GOPATH: /go
  POSTGRES_DB: test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: secret
  # Тесты (integration/e2e) ходят в БД/Redis по имени сервиса внутри docker-сети.
  TEST_DATABASE_URL: postgres://postgres:secret@postgres:5432/test?sslmode=disable
  TEST_REDIS_ADDR: redis:6379

jobs:
  # ============================================================================
  # 1. Сборка трёх docker-образов (сервис, postgres, тестовый контейнер)
  # ============================================================================

  build-service:
    name: "Build: сервис (Dockerfile)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: "Login в GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Сборка и push образа сервиса"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/service:latest

  build-postgres:
    name: "Build: PostgreSQL (Dockerfile.postgres)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: "Login в GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Сборка и push образа PostgreSQL (с миграциями)"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.postgres
          push: true
          tags: ghcr.io/${{ github.repository }}/postgres:latest

  build-test:
    name: "Build: тестовый контейнер (Dockerfile.test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: "Login в GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Сборка и push тестового контейнера"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          push: true
          tags: ghcr.io/${{ github.repository }}/test:latest

  # ============================================================================
  # 2. Этап unit → integration → e2e
  # ============================================================================

  unit:
    name: "Этап 1/3 — Unit-тесты"
    needs: build-test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/test:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: "Генерация OpenAPI-кода (internal/api в .gitignore)"
        run: go generate
      - name: "Запуск unit-тестов (без БД: mock/stub)"
        env:
          ALLURE_OUTPUT_FOLDER: ${{ github.workspace }}/allure-results
        run: |
          echo "==> unit: go test -short -tags allure ./..."
          gotestsum --junitfile unit.xml -- -short -tags allure ./...
      - name: "Публикация результатов (JUnit + allure)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: |
            unit.xml
            allure-results/
          if-no-files-found: ignore

  integration:
    name: "Этап 2/3 — Integration-тесты (реальная БД)"
    needs: [unit, build-postgres]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/test:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: ghcr.io/${{ github.repository }}/postgres:latest
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: "Генерация OpenAPI-кода"
        run: go generate
      - name: "Ожидание применения миграций (таблица users)"
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U postgres -d test -tAc "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1; then
              echo "==> схема БД готова (миграции применены)"; break
            fi
            echo "==> жду миграции..."; sleep 2
          done
      - name: "Запуск integration-тестов (реальная БД)"
        env:
          ALLURE_OUTPUT_FOLDER: ${{ github.workspace }}/allure-results
        run: |
          echo "==> integration: go test -p 1 -tags integration -run Integration ./..."
          gotestsum --junitfile integration.xml -- -p 1 -tags integration -run Integration ./...
      - name: "Публикация результатов (JUnit + allure)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            integration.xml
            allure-results/
          if-no-files-found: ignore

  e2e:
    name: "Этап 3/3 — E2E-тест (развёрнутый сервис + БД)"
    needs: [integration, build-service, build-postgres]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/test:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: ghcr.io/${{ github.repository }}/postgres:latest
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      app:
        image: ghcr.io/${{ github.repository }}/service:latest
        env:
          CONFIG_PATH: configs/postgres_ci.yaml
          REDIS_URL: redis:6379
    env:
      # E2E-тест бьёт по развёрнутому сервису (имя сервиса в docker-сети).
      BASE_URL: http://app:8080
    steps:
      - uses: actions/checkout@v4
      - name: "Ожидание схемы БД и готовности сервиса"
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U postgres -d test -tAc "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1; then
              echo "==> схема БД готова"; break
            fi
            echo "==> жду миграции..."; sleep 2
          done
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://app:8080/subscriptions?uuid=00000000-0000-0000-0000-000000000000 || true)
            if [ "$code" != "000" ]; then echo "==> сервис готов (HTTP $code)"; break; fi
            echo "==> жду сервис..."; sleep 2
          done
      - name: "Запуск E2E-теста против сервиса (видны все запросы/ответы)"
        env:
          ALLURE_OUTPUT_FOLDER: ${{ github.workspace }}/allure-results
        run: |
          echo "==> e2e: go test -v -p 1 -tags e2e ./test/e2e/..."
          go test -p 1 -tags e2e -v ./test/e2e/...
      - name: "Публикация результатов (allure)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: allure-results/
          if-no-files-found: ignore

  # ============================================================================
  # 3. Отчёт (генерируется всегда)
  # ============================================================================

  report:
    name: "Отчёт Allure (с историей для трендов)"
    needs: [unit, integration, e2e, build-test]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/test:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "Скачивание результатов всех этапов"
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: "Восстановление истории allure (тренды)"
        uses: actions/cache@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}
          restore-keys: |
            allure-history-

      - name: "Генерация allure-отчёта"
        run: |
          mkdir -p allure-results
          cp -r results/unit-results/allure-results/* allure-results/ 2>/dev/null || true
          cp -r results/integration-results/allure-results/* allure-results/ 2>/dev/null || true
          cp -r results/e2e-results/allure-results/* allure-results/ 2>/dev/null || true
          if [ -d allure-report/history ]; then cp -r allure-report/history allure-results/history; fi
          allure generate allure-results -o allure-report --clean

      - name: "Публикация allure-отчёта"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore

  # ============================================================================
  # 4. Публикация allure-отчёта в GitHub Pages
  # ============================================================================

  deploy-pages:
    name: "Публикация allure-отчёта в GitHub Pages"
    needs: report
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Скачивание allure-отчёта"
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: "Деплой в ветку gh-pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
