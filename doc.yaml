openapi: 3.0.4

info:
  title: Subscriber Inf - OpenAPI 3.0
  version: 1.1.1

tags:
- name: subscriptions
  description: subscriptions actions
- name: promocodes
  description: Promocodes management
- name: subscription-plans
  description: Subscription plans (templates) management

paths:
  /subscriptions:
    post:
      tags:
      - subscriptions
      summary: Add new subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      responses:
        '201':
          description: Subscription added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "new sub_id: 123"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    get:
      tags:
      - subscriptions
      summary: Get subscriptions by user id.
      parameters:
      - name: uuid
        in: query
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /subscriptions/{id}:
    get:
      tags:
      - subscriptions
      summary: Get subscription
      description: Get subscription by sub_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    put:
      tags:
      - subscriptions
      summary: Update subscription
      description: Update description by sub_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      responses:
        '200':
          description: Successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "subscription updated"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
      - subscriptions
      summary: Delete subscription
      description: Delete subscription by sub_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "nice"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /subscriptions/{id}/apply-promocode:
    post:
      tags:
      - subscriptions
      summary: Apply promocode to subscription
      description: Apply a promocode to an existing subscription to get discount
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                promocode:
                  type: string
                  example: "SUMMER2025"
              required:
              - promocode
        required: true
      responses:
        '200':
          description: Promocode applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Promocode applied successfully"
                  discount_applied:
                    type: integer
                    example: 20
                  new_price:
                    type: integer
                    example: 319
        '400':
          description: Invalid input or promocode not applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Subscription or promocode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /total_costs:
    post:
      tags:
      - subscriptions
      summary: Get total costs
      description: Get total costs during some period by user id and service name
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  example: "08-2024"
                end_date:
                  type: string
                  example: "08-2025"
                filter:
                  type: object
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    service_name:
                      type: string
                      example: "Yandex Plus"
                    sub_type:
                      $ref: "#/components/schemas/SubscriptionType"
                  required:
                  - service_name
                sort_by:
                  type: string
                  enum: [price, start_date, end_date, duration_months, total_cost_for_period]
                  default: price
                  description: "Field to sort by"
                sort_order:
                  type: string
                  enum: [asc, desc]
                  default: desc
                  description: "Sort order"
              required:
              - start_date
              - filter
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_sum:
                    type: integer
                    format: int64
                    example: 7320
                  sub_ids:
                    description: Ids of all fitted subscriptions
                    type: array
                    items:
                      type: integer
                      format: int64
                  subscriptions:
                    description: Detailed subscription data
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionDetail"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /promocodes:
    post:
      tags:
      - promocodes
      summary: Create a new promocode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Promocode'
        required: true
      responses:
        '201':
          description: Promocode created
          content:
            application/json:
              schema:
                type: object
                properties:
                  promocode_id:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: "promocode created successfully"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    get:
      tags:
      - promocodes
      summary: Get all promocodes (optional filtering)
      parameters:
      - name: service_id
        in: query
        description: Filter by service ID
        required: false
        schema:
          type: integer
      - name: plan_id
        in: query
        description: Filter by subscription plan ID
        required: false
        schema:
          type: integer
      - name: sub_id
        in: query
        description: Filter by subscription ID
        required: false
        schema:
          type: integer
      - name: status
        in: query
        description: Filter by status
        required: false
        schema:
          $ref: '#/components/schemas/PromocodeStatus'
      - name: discount_min
        in: query
        description: Minimum discount percentage
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: discount_max
        in: query
        description: Maximum discount percentage
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: expires_before
        in: query
        description: Filter promocodes expiring before this date (ISO 8601)
        required: false
        schema:
          type: string
          format: date-time
      - name: expires_after
        in: query
        description: Filter promocodes expiring after this date (ISO 8601)
        required: false
        schema:
          type: string
          format: date-time
      - name: code_contains
        in: query
        description: Filter by promocode value containing substring
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of promocodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promocode'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /promocodes/{id}:
    get:
      tags:
      - promocodes
      summary: Get promocode by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Promocode found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocode'
        '404':
          description: Promocode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    put:
      tags:
      - promocodes
      summary: Update promocode
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Promocode'
        required: true
      responses:
        '200':
          description: Promocode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "promocode updated successfully"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Promocode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
      - promocodes
      summary: Delete promocode by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Promocode deleted
        '404':
          description: Promocode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /promocodes/code/{code}:
    get:
      tags:
      - promocodes
      summary: Get promocode by its code value
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Promocode found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promocode'
        '404':
          description: Promocode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /subscription-plans:
    post:
      tags:
      - subscription-plans
      summary: Create a new subscription plan (template)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlan'
        required: true
      responses:
        '201':
          description: Subscription plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: "subscription plan created successfully"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    get:
      tags:
      - subscription-plans
      summary: Get all subscription plans (optional filtering)
      parameters:
      - name: service_id
        in: query
        description: Filter by service ID
        required: false
        schema:
          type: integer
      - name: name_contains
        in: query
        description: Filter by plan name containing substring
        required: false
        schema:
          type: string
      - name: price_min
        in: query
        description: Minimum price
        required: false
        schema:
          type: integer
          minimum: 0
      - name: price_max
        in: query
        description: Maximum price
        required: false
        schema:
          type: integer
          minimum: 0
      - name: duration_days_min
        in: query
        description: Minimum duration in days
        required: false
        schema:
          type: integer
          minimum: 1
      - name: duration_days_max
        in: query
        description: Maximum duration in days
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: List of subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /subscription-plans/{id}:
    get:
      tags:
      - subscription-plans
      summary: Get subscription plan by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Subscription plan found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'
        '404':
          description: Subscription plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    put:
      tags:
      - subscription-plans
      summary: Update subscription plan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlan'
        required: true
      responses:
        '200':
          description: Subscription plan updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "subscription plan updated successfully"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Subscription plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
      - subscription-plans
      summary: Delete subscription plan by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Subscription plan deleted
        '404':
          description: Subscription plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /stats/overview:
    get:
      tags:
      - analytics
      summary: Get system overview statistics
      description: Returns aggregated statistics about subscriptions, promocodes, and revenue
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_subscriptions:
                    type: integer
                    example: 150
                  active_subscriptions:
                    type: integer
                    example: 120
                  total_promocodes:
                    type: integer
                    example: 25
                  active_promocodes:
                    type: integer
                    example: 18
                  total_revenue:
                    type: integer
                    example: 50000
                  avg_subscription_price:
                    type: number
                    format: float
                    example: 333.33
                  most_popular_service:
                    type: string
                    example: "Yandex Plus"
                  service_stats:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceStats'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /users:
    post:
      tags:
      - users
      summary: Create a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /users/{user_id}:
    get:
      tags:
      - users
      summary: Get user by ID
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /subscriptions/purchase:
    post:
      tags:
      - subscriptions
      summary: Purchase a subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseSubscriptionRequest'
        required: true
      responses:
        '201':
          description: Subscription purchased successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription_id:
                    type: integer
                    example: 123
        '400':
          description: Invalid input or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        message:
          type: string
    SubscriptionType:
      type: string
      enum: [ usual, promocode, family ]
      default: usual
    Subscription:
      type: object
      properties:
        service_name:
          type: string
          example: "Yandex Plus"
        price:
          type: integer
          format: int64
          example: 399
        user_id:
          type: string
          format: uuid
        sub_type:
          $ref: "#/components/schemas/SubscriptionType"
        start_date:
          type: string
          example: "07-2025"
          description: "Date in format MM-YYYY"
        end_date:
          type: string
          example: "08-2025"
          description: "Date in format MM-YYYY"
      required:
      - service_name
      - price
      - user_id
      - start_date
    SubscriptionDetail:
      type: object
      properties:
        sub_id:
          type: integer
          format: int64
          example: 123
        service_name:
          type: string
          example: "Yandex Plus"
        price:
          type: integer
          format: int64
          example: 399
        user_id:
          type: string
          format: uuid
        sub_type:
          $ref: "#/components/schemas/SubscriptionType"
        start_date:
          type: string
          example: "07-2025"
          description: "Date in format MM-YYYY"
        end_date:
          type: string
          example: "08-2025"
          description: "Date in format MM-YYYY"
        duration_months:
          type: integer
          example: 2
          description: "Duration of subscription within the filtered period (months)"
        total_cost_for_period:
          type: integer
          format: int64
          example: 798
          description: "Total cost for this subscription within the filtered period (price * duration_months)"
      required:
        - sub_id
        - service_name
        - price
        - user_id
        - sub_type
        - start_date
    ServiceStats:
      type: object
      properties:
        service_name:
          type: string
        total_subscriptions:
          type: integer
        total_revenue:
          type: integer
        avg_subscription_cost:
          type: number
          format: float
        execution_time:
          type: string
        source:
          type: string
    ExecutionMetric:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        operation:
          type: string
        source:
          type: string
        duration:
          type: string
        data_changed:
          type: boolean
    TestScenario:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        interval:
          type: string
        data_change:
          type: string
          enum: [ none, add, delete, update ]
    PromocodeStatus:
      type: string
      enum: [ ACTIVE, USED, DISABLED ]
      default: ACTIVE
    Promocode:
      type: object
      properties:
        promocode_id:
          type: integer
          example: 1
        service_id:
          type: integer
          example: 5
        plan_id:
          type: integer
          nullable: true
          example: 10
        sub_id:
          type: integer
          nullable: true
          example: 100
        value:
          type: string
          example: "SUMMER2025"
        expires_at:
          type: string
          format: date-time
          example: "2025-12-31T23:59:59Z"
        created_at:
          type: string
          format: date-time
          example: "2025-01-01T00:00:00Z"
        discount:
          type: integer
          minimum: 0
          maximum: 100
          example: 20
          description: Discount percentage (0-100)
        max_uses:
          type: integer
          minimum: 1
          example: 100
        cur_uses:
          type: integer
          minimum: 0
          example: 5
        status:
          $ref: '#/components/schemas/PromocodeStatus'
        duration_days:
          type: integer
          minimum: 1
          example: 30
          description: Duration in days used to calculate expires_at if not provided
    SubscriptionPlan:
      type: object
      properties:
        plan_id:
          type: integer
          example: 1
        service_id:
          type: integer
          example: 5
        name:
          type: string
          example: "Premium Monthly"
        service_name:
          type: string
          example: "Premium"
        sub_type:
          type: string
          example: "Monthly"
        duration_days:
          type: integer
          example: 30
        price:
          type: integer
          format: int64
          example: 2999
    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
