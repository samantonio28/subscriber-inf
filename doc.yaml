openapi: 3.0.4

info:
  title: Subscriber Inf - OpenAPI 3.0
  version: 1.0.5

tags:
- name: subscriptions
  description: subscriptions actions

paths:
  /subscriptions:
    post:
      tags:
      - subscriptions
      summary: Add new subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      responses:
        '201':
          description: Subscription added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "new sub_id: 123"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    get:
      tags:
      - subscriptions
      summary: Get subscriptions by user id.
      parameters:
      - name: uuid
        in: query
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /subscriptions/{id}:
    get:
      tags:
      - subscriptions
      summary: Get subscription
      description: Get subscription by sub_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    put:
      tags:
      - subscriptions
      summary: Update subscription
      description: Update description by sub_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
        required: true
      responses:
        '200':
          description: Successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "subscription updated"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
      - subscriptions
      summary: Delete subscription
      description: Delete subscription by sub_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Successful deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "nice"
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /total_costs:
    post:
      tags:
      - subscriptions
      summary: Get total costs
      description: Get total costs during some period by user id and service name
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  example: "08-2024"
                end_date:
                  type: string
                  example: "08-2025"
                filter:
                  type: object
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    service_name:
                      type: string
                      example: "Yandex Plus"
                    sub_type:
                      $ref: "#/components/schemas/SubscriptionType"
                  required:
                  - service_name
              required:
              - start_date
              - filter
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_sum:
                    type: integer
                    format: int64
                    example: 7320
                  sub_ids:
                    description: Ids of all fitted subscriptions
                    type: array
                    items:
                      type: integer
                      format: int64
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        message:
          type: string
    SubscriptionType:
      type: string
      enum: [ usual, promocode, family ]
      default: usual
    Subscription:
      type: object
      properties:
        service_name:
          type: string
          example: "Yandex Plus"
        price:
          type: integer
          format: int64
          example: 399
        user_id:
          type: string
          format: uuid
        sub_type:
          $ref: "#/components/schemas/SubscriptionType"
        start_date:
          type: string
          example: "07-2025"
          description: "Date in format MM-YYYY"
        end_date:
          type: string
          example: "08-2025"
          description: "Date in format MM-YYYY"
      required:
      - service_name
      - price
      - user_id
      - start_date
    ServiceStats:
      type: object
      properties:
        service_name:
          type: string
        total_subscriptions:
          type: integer
        total_revenue:
          type: integer
        avg_subscription_cost:
          type: number
          format: float
        execution_time:
          type: string
        source:
          type: string
    ExecutionMetric:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        operation:
          type: string
        source:
          type: string
        duration:
          type: string
        data_changed:
          type: boolean
    TestScenario:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        interval:
          type: string
        data_change:
          type: string
          enum: [ none, add, delete, update ]
