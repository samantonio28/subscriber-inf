# Database configuration
type: mysql  # or sqlite or mysql
postgres:
  host: "localhost"
  port: 8001
  user: "postgres"
  password: "secret"
  dbname: "dev"
  sslmode: "disable"
  pool:
    max_conns: 10
    min_conns: 2
    max_conn_lifetime: "1h"
    max_conn_idle_time: "5m"
sqlite:
  path: "./data/subscriber.db"
mysql:
  host: "localhost"
  port: 3306
  user: "root"
  password: "secret"
  dbname: "dev"
  params: "charset=utf8mb4&parseTime=True&loc=Local"