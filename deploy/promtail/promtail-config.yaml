# Promtail — WebLab #5. Собирает stdout-логи всех контейнеров (docker_sd) в Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Собираем только контейнеры нашего compose-проекта (subscriber-inf),
      # иначе docker_sd на общем сокете подтянет логи чужих проектов.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'subscriber-inf'
        action: keep
      # Имя контейнера → label container (например /nginx, /backend-read1).
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Имя сервиса docker compose → label service.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Отбрасываем служебные контейнеры наблюдаемости, чтобы не шуметь в логах.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(prometheus|loki|promtail|grafana)'
        action: drop
