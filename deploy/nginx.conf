# WebLab #4 — WEB SERVER v1.0 (nginx)
# Единая точка входа: маршрутизация API, Swagger UI, статики и служебных страниц.
#
# Таблица маршрутов:
#   /                 -> статический welcome (index.html)
#   /reserved/        -> та же страница, что и /
#   /static/          -> статика (index.html, img/*.png — эскизы WebLab#1)
#   /api/v1/          -> backend (REST API v1)
#   /api/v2/          -> backend (REST API v2)
#   /api/v2/docs/     -> Swagger UI (swagger-ui контейнер)
#   /api/v2/openapi.yaml -> спецификация (статикой)
#   /documentation    -> WebLab#1.md
#   /legacy           -> страница консольной версии (ППО LR5)
#   /status           -> страница статуса сервера
#   /health /ready    -> backend (liveness / readiness)
#   /admin/           -> Adminer (ограничен basic-auth)
#   /management       -> страница со ссылками на все маршруты

server {
    listen 80;
    server_name _;

    root /srv/static;
    index index.html;
    charset utf-8;

    # --- REST API (проксирование на бэкенд) ---
    location /api/v2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Swagger UI ---
    # Спецификация отдаётся статикой nginx, сам UI — контейнером swagger-ui.
    location = /api/v2/openapi.yaml {
        alias /srv/swagger/openapi.yaml;
        default_type application/yaml;
    }

    # При обращении к /api/v2 (без слэша) — скачивание спецификации
    location = /api/v2 {
        alias /srv/swagger/openapi.yaml;
        default_type application/yaml;
        add_header Content-Disposition 'attachment; filename="openapi.yaml"';
    }

    # Swagger UI (контейнер swagger-ui) запрашивает спецификацию по абсолютному пути.
    location = /openapi.yaml {
        alias /srv/swagger/openapi.yaml;
        default_type application/yaml;
    }

    location = /api/v2/docs {
        return 301 /api/v2/docs/;
    }

    location /api/v2/docs/ {
        proxy_pass http://swagger-ui:8080/;
        proxy_set_header Host $host;
    }

    # --- Health / readiness ---
    location = /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # --- Документация (содержимое WebLab#1) ---
    location = /documentation {
        alias /srv/documentation/WebLab1.md;
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
    }

    # --- Legacy: консольная версия (ППО LR5) ---
    location = /legacy {
        try_files /legacy.html =404;
    }

    # Скачивание консольной версии (собранный бинарник CLI)
    location = /legacy/download {
        alias /srv/bin/subscriber-cli;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="subscriber-cli"';
    }

    # --- Статус сервера ---
    location = /status {
        try_files /status.html =404;
    }

    # --- Management: ссылки на все маршруты ---
    location = /management {
        try_files /management.html =404;
    }

    # --- Статика (эскизы и служебные страницы) ---
    location /static/img/ {
        alias /srv/img/;
    }

    location /static/ {
        alias /srv/static/;
    }

    # --- Admin: админка БД (ограничен доступ) ---
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        auth_basic "Admin area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
    }

    # --- Приветственная страница и её копия ---
    location = / {
        try_files /index.html =404;
    }

    location = /reserved {
        return 301 /reserved/;
    }

    location = /reserved/ {
        try_files /index.html =404;
    }
}
