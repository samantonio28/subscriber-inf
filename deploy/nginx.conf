# WebLab #5 — WEB SERVER v2.0 (openresty/nginx)
# Балансировка чтения 2:1:1, маршрутизация записи на один узел,
# /mirror (отдельная версия приложения за репликой БД), кэш+gzip,
# подмена Server, /monitoring (Grafana), stub_status.
#
# Образ: openresty/openresty:alpine (нужен headers-more для подмены Server).

# --- Кэш ответов прокси (публичные, неперсонализированные ресурсы) ---
# Зона 10MB в памяти + до 100MB на диске; запись живёт 10 минут.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=public_cache:10m
                 max_size=100m inactive=10m use_temp_path=off;

# --- Метод → пул для балансировки (чтение на 3 бэкенда, запись на 1) ---
map $request_method $backend_pool {
    default          backend_write;
    GET              backend_balancer;
    HEAD             backend_balancer;
    OPTIONS          backend_balancer;
}

map $request_method $mirror_pool {
    default          mirror_write;
    GET              mirror_balancer;
    HEAD             mirror_balancer;
    OPTIONS          mirror_balancer;
}

# --- Основной пул чтения: 2:1:1 (primary вес 2, два read-only вес 1) ---
# max_fails=3: одноразовый сбой (например, stale keepalive-соединение) не должен
# выводить инстанс из балансировки; fail_timeout — окно повторных попыток.
upstream backend_balancer {
    server backend:8080        weight=2 max_fails=3 fail_timeout=30s;
    server backend-read1:8081  weight=1 max_fails=3 fail_timeout=30s;
    server backend-read2:8082  weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --- Единственный узел на запись ---
upstream backend_write {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# --- /mirror: свой пул чтения (write 2 : read 1) ---
upstream mirror_balancer {
    server mirror-backend:8080       weight=2 max_fails=3 fail_timeout=30s;
    server mirror-backend-read:8080  weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream mirror_write {
    server mirror-backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# --- Лог в JSON (для Loki) с адресом upstream (доказательство балансировки) ---
log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"upstream_addr":"$upstream_addr","request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time","server_name":"$server_name",'
    '"http_user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    root /srv/static;
    index index.html;
    charset utf-8;

    # Подмена имени сервера в заголовках ответов (требование п.4).
    more_set_headers 'Server: SubscriberInf';
    server_tokens off;

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # --- Кэш дескрипторов/метаданных файлов статики (open_file_cache) ---
    # Повторные обращения к одному файлу не бьют в диск.
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # При сбое инстанса — пробуем следующий upstream (обнаружение отказа).
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 3s;

    # --- gzip сжатие текстовых ответов (требование п.5) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # --- REST API: чтение → 2:1:1, запись → один узел (требование п.1) ---
    location /api/v2/ {
        proxy_pass http://$backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    location /api/v1/ {
        proxy_pass http://$backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # --- Swagger UI (основной) ---
    location = /api/v2/openapi.yaml {
        alias /srv/swagger/openapi.yaml;
        default_type application/yaml;
        add_header Cache-Control "no-store";
    }

    location = /api/v2 {
        alias /srv/swagger/openapi.yaml;
        default_type application/yaml;
        add_header Content-Disposition 'attachment; filename="openapi.yaml"';
        add_header Cache-Control "no-store";
    }

    location = /openapi.yaml {
        alias /srv/swagger/openapi.yaml;
        default_type application/yaml;
        add_header Cache-Control "no-store";
    }

    location = /api/v2/docs {
        return 301 /api/v2/docs/;
    }

    location /api/v2/docs/ {
        proxy_pass http://swagger-ui:8080/;
        proxy_set_header Host $host;
        # Публичный неперсонализированный ресурс — кэшируем ответ nginx'ом.
        proxy_cache public_cache;
        proxy_cache_valid 200 301 10m;
        proxy_cache_key $request_uri;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # --- Health / readiness (проверки состояния — вне кэша) ---
    location = /health {
        proxy_pass http://backend_write;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /ready {
        proxy_pass http://backend_write;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    # --- Документация ---
    location = /documentation {
        alias /srv/documentation/WebLab1.md;
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-store";
    }

    # --- Legacy ---
    location = /legacy {
        try_files /legacy.html =404;
        add_header Cache-Control "no-store";
    }

    location = /legacy/download {
        alias /srv/bin/subscriber-cli;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="subscriber-cli"';
        add_header Cache-Control "no-store";
    }

    # --- Статус (служебная страница — вне кэша) ---
    location = /status {
        try_files /status.html =404;
        add_header Cache-Control "no-store";
    }

    # --- Management (служебная страница — вне кэша) ---
    location = /management {
        try_files /management.html =404;
        add_header Cache-Control "no-store";
    }

    # --- Статика (публичный кэш, требование п.5) ---
    location /static/img/ {
        alias /srv/img/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Admin (ограничен, вне кэша) ---
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        auth_basic "Admin area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    # --- /monitoring → Grafana (требование п.6) ---
    location = /monitoring {
        return 301 /monitoring/;
    }

    location /monitoring/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # --- /mirror: отдельная версия приложения за репликой БД (требование п.3) ---
    location = /mirror {
        return 301 /mirror/;
    }

    location = /mirror/ {
        try_files /mirror.html =404;
        add_header Cache-Control "no-store";
    }

    location = /mirror/status {
        try_files /mirror.html =404;
        add_header Cache-Control "no-store";
    }

    location = /mirror/management {
        try_files /mirror.html =404;
        add_header Cache-Control "no-store";
    }

    # Статика mirror (публичный кэш)
    location /mirror/static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Спецификация mirror
    location = /mirror/api/v2/openapi.yaml {
        alias /srv/swagger/openapi.yaml;
        default_type application/yaml;
        add_header Cache-Control "no-store";
    }

    # Swagger UI mirror (общая спецификация, тот же swagger-ui)
    location = /mirror/api/v2/docs {
        return 301 /mirror/api/v2/docs/;
    }

    location ^~ /mirror/api/v2/docs/ {
        proxy_pass http://swagger-ui:8080/;
        proxy_set_header Host $host;
        # Публичный неперсонализированный ресурс — кэшируем ответ nginx'ом.
        proxy_cache public_cache;
        proxy_cache_valid 200 301 10m;
        proxy_cache_key $request_uri;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # API mirror: снимаем префикс /mirror и проксируем в свой пул.
    # Запись идёт в mirror_write (→ primary), чтение — 2:1:1 (write + read-реплика).
    location /mirror/api/ {
        rewrite ^/mirror(/.*)$ $1 break;
        proxy_pass http://$mirror_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # Health/ready mirror → свой пул (проверки состояния — вне кэша)
    location = /mirror/health {
        rewrite ^/mirror(/.*)$ $1 break;
        proxy_pass http://$mirror_pool;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    location = /mirror/ready {
        rewrite ^/mirror(/.*)$ $1 break;
        proxy_pass http://$mirror_pool;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    # --- Приветственная страница и её копия ---
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /reserved {
        return 301 /reserved/;
    }

    location = /reserved/ {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
}
