# Prometheus — WebLab #5. Скрейпит /metrics со всех экземпляров приложения.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'subscriber-inf'
    metrics_path: /metrics
    static_configs:
      - targets:
          # основной стек (чтение 2:1:1)
          - 'backend:8080'
          - 'backend-read1:8081'
          - 'backend-read2:8082'
          # /mirror (отдельная версия приложения)
          - 'mirror-backend:8080'
          - 'mirror-backend-read:8080'
