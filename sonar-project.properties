# SonarQube: конфигурация анализа проекта.
# Используется таргетом `make sonar-scan` (sonar-scanner читает этот файл).

sonar.projectKey=subscriber-inf
sonar.projectName=subscriber-inf
sonar.projectVersion=1.0

# Локальный SonarQube в Docker (make sonar-up).
sonar.host.url=http://localhost:9000

sonar.sources=.
sonar.tests=.

# Разводим sources и tests, чтобы ни один файл не индексировался дважды
# (иначе ошибка «File X can't be indexed twice»).
sonar.exclusions=**/*_test.go,**/mocks/**,**/testutil/**,**/reports/**,**/allure-results/**,**/*.gen.go
sonar.test.inclusions=**/*_test.go

# Покрытие в нативном формате Go (coverage.out) — SonarQube понимает его
# напрямую, без конвертации в Cobertura (конвертация ломается из-за абсолютных
# путей в <source> → покрытие показывается как 0%).
sonar.go.coverage.reportPaths=coverage.out
